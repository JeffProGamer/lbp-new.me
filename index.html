<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBP.me Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Welcome to LBP.me</h1>
    </header>
    <main>
        <div id="login-form">
            <h2>Sign In</h2>
            <form id="signInForm">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter your username">
                
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
                
                <button type="submit">Login</button>
            </form>
            <p>Don’t have an account? <a href="#" id="signupLink">Sign up here!</a></p>
        </div>

        <div id="signup-form" class="hidden">
            <h2>Sign Up</h2>
            <form id="signUpForm">
                <label for="new-username">Username</label>
                <input type="text" id="new-username" required placeholder="Choose a username">
                
                <label for="new-password">Password</label>
                <input type="password" id="new-password" required placeholder="Choose a password">
                
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="#" id="loginLink">Log in here!</a></p>
        </div>
    </main>
</body>
</html>
