<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LBP.me - Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🎮 Welcome to LBP.me 🎮</h1>
    <nav>
      <a href="index.html">🏠 Home</a>
      <a href="levels.html">🌟 Browse Levels</a>
      <a href="#" id="logout">🔓 Log Out</a>
    </nav>
  </header>
  
  <section>
    <h2>🏅 Your Profile</h2>
    <p id="profile-info"></p>
    <h3>Your Levels:</h3>
    <div id="user-levels" class="grid"></div>
  </section>

  <footer>
    <p>© 2025 LBP.me | Made with ❤️</p>
  </footer>
  
  <script>
    const profileInfo = document.getElementById("profile-info");
    const userLevelsContainer = document.getElementById("user-levels");
    const logoutButton = document.getElementById("logout");

    // Load the signed-in user
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));
    if (!currentUser) {
      // Redirect to sign-in page if no user is signed in
      window.location.href = "auth.html";
    } else {
      profileInfo.textContent = `Welcome, ${currentUser.username}!`;

      // Simulate loading user-specific levels
      const userLevels = [
        { title: "Epic Adventure", plays: 105, likes: 89 },
        { title: "Jungle Dash", plays: 50, likes: 30 }
      ];

      // Display user levels
      userLevels.forEach(level => {
        const div = document.createElement("div");
        div.innerHTML = `
          <h3>${level.title}</h3>
          <p>Plays: ${level.plays} | Likes: ${level.likes}</p>`;
        userLevelsContainer.appendChild(div);
      });
    }

    // Log out functionality
    logoutButton.addEventListener("click", () => {
      localStorage.removeItem("currentUser");
      window.location.href = "auth.html";
    });
  </script>
</body>
</html>
