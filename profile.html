<script type="module">
  import { connectToLBPServer, getUserData } from './servers.js';

  document.addEventListener("DOMContentLoaded", async () => {
      const loggedInUser = localStorage.getItem("loggedInUser");
      const profileUsername = document.getElementById("profile-username");

      // Check if a user is logged in
      if (!loggedInUser) {
          alert("You must log in to access your profile!");
          window.location.href = "index.html"; // Redirect to login page
          return;
      }

      // Connect to the server
      await connectToLBPServer();

      // Fetch user data
      try {
          const userData = await getUserData(loggedInUser);
          profileUsername.textContent = userData.username;
      } catch (error) {
          alert(error); // Handle error if user is not found
      }
  });
</script>
