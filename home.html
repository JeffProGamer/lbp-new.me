<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LittleBigPlanet 3 Level Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>LittleBigPlanet 3 Level Tracker</h1>
        <div id="authSection">
            <button id="signInBtn">Sign In</button>
            <button id="signUpBtn">Sign Up</button>
            <button id="logoutBtn" style="display:none;">Log Out</button>
        </div>
    </header>

    <main id="mainContent">
        <!-- Sign Up/Sign In forms will be injected here -->
    </main>

    <section id="levelSubmissionSection" style="display:none;">
        <h2>Submit Your Level</h2>
        <form id="levelForm">
            <label for="levelID">Level ID:</label>
            <input type="text" id="levelID" required><br><br>

            <label for="levelName">Level Name:</label>
            <input type="text" id="levelName" required><br><br>

            <label for="levelPlays">Plays:</label>
            <input type="number" id="levelPlays" required><br><br>

            <label for="levelLikes">Likes:</label>
            <input type="number" id="levelLikes" required><br><br>

            <button type="submit">Submit Level</button>
        </form>
    </section>

    <h2>Your Level Stats</h2>
    <div id="levelStats">
        <!-- Level stats will be displayed here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
